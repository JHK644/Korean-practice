</p></section><section><h2>2. 기기 음성 듣기</h2><p>“안녕하세요?”</p><button id="tts">▶ 기기 음성 듣기</button><p role="status" id="ttsStatus">버튼을 눌러 주세요.</p></section><p>확인 후 ① 음성 파일과 ② 기기 음성 중 어느 쪽이 들리는지 알려 주세요.</p><a href="./index.html">학습 프로그램으로 돌아가기</a><script>
const audio=document.getElementById('audio'),mp3Status=document.getElementById('mp3Status'),ttsStatus=document.getElementById('ttsStatus');let active=null,watch=null;
document.getElementById('mp3').onclick=()=>{mp3Status.textContent='재생 준비 중';audio.currentTime=0;audio.play().catch(e=>mp3Status.textContent='재생 실패: '+e.name)};
audio.onplaying=()=>mp3Status.textContent='음성 파일 재생 중';audio.onended=()=>mp3Status.textContent='음성 파일 재생 완료';audio.onerror=()=>mp3Status.textContent='파일 재생 오류: '+(audio.error?.code||'unknown');
document.getElementById('tts').onclick=()=>{if(!window.speechSynthesis){ttsStatus.textContent='기기 음성 기능 없음';return}if(active){ttsStatus.textContent='이전 시험이 진행 중입니다';return}const u=new SpeechSynthesisUtterance('안녕하세요?');active=u;u.lang='ko-KR';ttsStatus.textContent='기기 음성 준비 중';const finish=msg=>{if(active!==u)return;clearTimeout(watch);active=null;ttsStatus.textContent=msg};u.onstart=()=>{clearTimeout(watch);ttsStatus.textContent='기기 음성 재생 중'};u.onend=()=>finish('기기 음성 재생 완료');u.onerror=e=>finish('기기 음성 재생 실패: '+e.error);watch=setTimeout(()=>{finish('기기 음성이 8초 안에 시작되지 않았습니다');speechSynthesis.cancel()},8000);try{speechSynthesis.speak(u)}catch(e){finish('기기 음성 재생 실패: '+e.name)}};
