<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>발음연습 · 학생용 공개 V1.0</title><link rel="stylesheet" href="static/style.css"></head>
<body><div class="app"><header><div class="header-row"><div><h1 id="title">한국어 발음연습</h1><div class="sub" id="subtitle"></div></div><a class="plain" href="index.html" style="text-decoration:none">← 선택 화면</a></div></header><main><p id="loadStatus" class="notice error" hidden role="alert"></p>
<div class="top"><div class="modes"><button id="forward" class="active"></button><button id="reverse"></button></div><div class="review-actions"><button class="plain" id="newReview" hidden>🎲 새 20개 뽑기</button><button class="plain" id="shuffle">순서 섞기</button></div></div>
<div class="progress-row"><span id="count"></span><span id="doneText"></span></div><div class="bar"><i id="bar"></i></div>
<button class="card" id="card"><span class="tag" id="tag"></span><span class="word" id="prompt" dir="auto"></span><span class="answer" id="answer" dir="auto"></span><span class="hint">카드를 누르면 정답이 보입니다</span></button>
<p id="revealCountdown" class="notice" hidden aria-label="정답 공개까지 남은 시간"></p>
<div class="judge"><button class="again" id="again">↺ 다시 볼래요</button><button class="know" id="know">✓ 알고 있어요</button></div>
<div class="nav"><button id="prev">← 이전</button><button id="next">다음 →</button></div>
<div class="audio single-audio"><button id="koSpeak">🔊 한국어 3번 듣기</button></div><div class="voice" id="voiceStatus"></div>
<p class="help" id="langNote"></p>
<details><summary>한국어 음성 설정</summary><p class="help">이 기기에 설치된 한국어 TTS를 사용합니다. 한 번 선택한 음성은 브라우저에 저장됩니다.</p><label>한국어<select id="koVoice"></select></label><div class="actions"><button class="plain" id="reloadVoices">음성 목록 다시 확인</button><button class="plain" id="stopAudio">■ 재생 중지</button></div><p class="help">음성 목록이 늦게 표시되더라도 듣기를 눌러 볼 수 있습니다. 저장한 음성이 없으면 현재 기기의 한국어 음성을 자동 선택합니다.</p></details>
<div class="stats"><span>다시 볼 단어 <b id="reviewN">0</b></span><span>아는 단어 <b id="knownN">0</b></span></div>

</main></div><script src="static/data.js?v=1.0"></script><script src="static/practice.js?v=1.0"></script></body></html>
